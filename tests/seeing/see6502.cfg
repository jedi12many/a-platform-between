# cart/walk/seeing.s on its own, for tests/seeing/run_seeing.py: the code at $1000 (the
# stub's jumps first), its variables at $6000, the map's rows and the log where the
# harness puts them.
MEMORY {
    MAIN: file = %O, start = $1000, size = $4000;
    VARS: file = "", start = $6000, size = $0800;
}
SEGMENTS {
    CODE: load = MAIN, type = ro;
    SEEING: load = MAIN, type = ro;
    BSS:  load = VARS, type = bss, define = yes;
}
