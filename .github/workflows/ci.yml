name: CI

on:
  push:
  pull_request:

jobs:
  rules-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cc65, py65 (a 6502 emulator in Python) and Pillow (C64 pictures)
        run: sudo apt-get update && sudo apt-get install -y cc65 && python3 -m pip install --break-system-packages py65 pillow

      - name: Generated registry matches registry/*.txt
        run: make check-registry

      - name: Tests (native)
        run: make test

      - name: Tests (6502, sim65)
        run: make test-6502

      - name: Native vs 6502 crosscheck
        run: make crosscheck

      - name: Python tools (Passport reference, registry, Quest Script compiler)
        run: make test-python

      - name: Every Departure compiles and verifies
        run: make check-content

      - name: Story VM (playthroughs on PC and 6502, damaged images under sanitizers)
        run: make test-vm

      - name: Terminal front end (recorded playthrough, 40 columns, the round trip)
        run: make test-term

      - name: Receipts (C core against the Python reference, PC and 6502)
        run: make test-receipts

      - name: Combat rules (C core against the Python reference, PC and 6502)
        run: make test-combat

      - name: Build the C64 demo and The Fare's C64 disk
        run: make c64

      - name: C64 game (overlays, playthroughs on the C64 program in a 6502 emulator)
        run: make test-c64

      - name: Install SDL2, Emscripten and Playwright's Chromium (the modern front end)
        run: |
          sudo apt-get install -y libsdl2-dev emscripten
          npm install -g playwright@1.56
          npx playwright install --with-deps chromium

      - name: Modern front end (desktop and browser play as the C64 does)
        run: make test-modern

      - name: The Waystation website (made in the browser, boarded in the terminal)
        run: make test-waystation

      - uses: actions/upload-artifact@v4
        with:
          name: c64
          path: |
            build/demo.prg
            build/the-fare.d64
            build/eighteen-minutes.d64

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: waystation
          path: build/waystation
