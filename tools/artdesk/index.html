<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Art Desk</title>
<link rel="stylesheet" href="artdesk.css">
</head>
<body>
<header class="bar">
  <h1>Art Desk <span class="sub">A Platform Between</span></h1>
  <nav id="files" aria-label="Art files"></nav>
  <div class="save">
    <span id="status" role="status" aria-live="polite"></span>
    <button id="revert" type="button" title="Throw away what isn't saved">Revert</button>
    <button id="save" type="button" class="primary" title="Save (Ctrl+S)">Save</button>
  </div>
</header>

<main>
  <aside class="entries">
    <div id="header-colours" class="panel"></div>
    <ul id="entry-list" aria-label="Entries"></ul>
    <div class="row-buttons">
      <button id="new" type="button">New</button>
      <button id="duplicate" type="button">Duplicate</button>
      <button id="rename" type="button">Rename</button>
      <button id="delete" type="button">Delete</button>
    </div>
    <p id="needs" class="note"></p>
  </aside>

  <section class="editor">
    <div class="toolbar" role="toolbar" aria-label="Tools">
      <div id="dots" class="dots" aria-label="Dots"></div>
      <div class="tools">
        <button type="button" data-tool="pen" title="Pen (P)">Pen</button>
        <button type="button" data-tool="line" title="Line (L)">Line</button>
        <button type="button" data-tool="box" title="Box (B)">Box</button>
        <button type="button" data-tool="fill" title="Fill (F)">Fill</button>
        <button type="button" data-tool="pick" title="Pick a dot (I)">Pick</button>
      </div>
      <div class="tools">
        <button type="button" id="undo" title="Undo (Ctrl+Z)">Undo</button>
        <button type="button" id="redo" title="Redo (Ctrl+Y)">Redo</button>
        <button type="button" id="flip" title="Mirror left to right">Flip</button>
        <button type="button" data-shift="-1,0" title="Shift left">&larr;</button>
        <button type="button" data-shift="1,0" title="Shift right">&rarr;</button>
        <button type="button" data-shift="0,-1" title="Shift up">&uarr;</button>
        <button type="button" data-shift="0,1" title="Shift down">&darr;</button>
        <button type="button" id="clear" title="Clear to the first dot">Clear</button>
      </div>
    </div>
    <div class="canvas-wrap">
      <canvas id="grid" aria-label="The dots: left button paints, right button erases"></canvas>
    </div>
    <p class="note" id="where">&nbsp;</p>
  </section>

  <aside class="side">
    <div class="panel">
      <h2 id="entry-title">&nbsp;</h2>
      <div id="own-colour"></div>
    </div>
    <div class="panel">
      <h2>As the game shows it</h2>
      <div id="previews"></div>
    </div>
  </aside>
</main>
<script src="artdesk.js"></script>
</body>
</html>
