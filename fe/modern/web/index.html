<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Platform Between</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #000; color: #959595; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  canvas { width: min(100vw, 160vh); aspect-ratio: 640 / 400; image-rendering: pixelated;
           display: none; cursor: pointer; }
  #pick { text-align: center; padding: 16px; }
  #pick h1 { color: #b8c76f; font-size: 1.4em; letter-spacing: 0.1em; margin: 0 0 1em; }
  #pick button { display: block; width: 100%; margin: 0.5em 0; padding: 0.7em 1.2em;
                 font: inherit; color: #000; background: #9ad284; border: 0; cursor: pointer; }
  #pick button:focus-visible { outline: 3px solid #fff; }
  #pick p { max-width: 32em; margin: 1.5em auto 0; font-size: 0.85em; }
  #status { margin-top: 1em; font-size: 0.85em; min-height: 1.5em; }
  #board-as { display: none; margin-top: 0.75em; gap: 0.5em; align-items: center; flex-wrap: wrap;
              justify-content: center; font-size: 0.85em; }
  #board-as select, #board-as button { font: inherit; padding: 0.3em 0.5em; }
  #board-as button { color: #000; background: #9ad284; border: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="pick">
  <h1>A PLATFORM BETWEEN</h1>
  <button data-departure="the-fare">Departure 00: The Fare</button>
  <button data-departure="eighteen-minutes">Departure 01: Eighteen Minutes</button>
  <button data-departure="deep-yards">The Deep Yards (a Siding: ten floors down)</button>
  <p>Board with a Boarding Pass from the Waystation, or a Passport (a trip that can't be
     stamped): type it, or paste it. Press a number, or
     click a line, to choose;
     S saves at a menu, and "Pick up a saved trip" carries on. Saves stay in this browser.</p>
</div>
<canvas id="screen" width="640" height="400" tabindex="0"
        aria-label="The game screen. Type to play."></canvas>
<div id="board-as">
  <label for="board-who">Your travelers:</label>
  <select id="board-who"></select>
  <button type="button" id="board-type">Type their Passport</button>
</div>
<div id="status">Loading...</div>
<script src="travelers.js"></script>
<script>
  var canvas = document.getElementById("screen");
  var ctx = canvas.getContext("2d");
  var image = ctx.createImageData(640, 400);
  var statusLine = document.getElementById("status");

  var Module = {
    /* The packed Departures, named .wasm: some hosts won't serve a .data file. */
    locateFile: function (p) { return p === "apb.data" ? "apb-data.wasm" : p; },
    keys: [],
    transcript: [],
    print: function (line) { Module.transcript.push(line); console.log(line); },
    printErr: function (line) { console.warn(line); },
    drawScreen: function (pixels) {
      image.data.set(pixels);
      ctx.putImageData(image, 0, 0);
    },
    preRun: [function () {
      FS.mkdir("/saves");
      FS.mount(IDBFS, {}, "/saves");
      Module.addRunDependency("saves");
      FS.syncfs(true, function () { Module.removeRunDependency("saves"); });
    }],
    onRuntimeInitialized: function () {
      statusLine.textContent = "";
      document.querySelectorAll("#pick button").forEach(function (b) { b.disabled = false; });
      if (Module.onReady) Module.onReady();
      /* Sent here by the platform page (site/index.html) with a mission and a Boarding Pass
       * it issued: straight onto the train, no codes to type. */
      var sent = new URLSearchParams(location.hash.slice(1));
      if (sent.get("departure")) {
        Module.start(sent.get("departure"), sent.has("choices") ? sent.get("choices") : undefined,
                     sent.get("pass") || "");
      }
    },
    /* The music and the sound effects (fe/modern/sound.c, web.c): Web Audio, started by
     * the game; browsers keep it quiet until a key or a click, so each one wakes it. */
    audio: null,
    onTripOver: function () {
      if (!statusLine.textContent) {
        statusLine.textContent = "The trip is over. Reload the page to travel again.";
      }
    },
    /* The trip's Travel Stamp (web.c), as the receipt comes up. Sent by the platform page,
     * it goes back there, to land on the traveler who boarded. Typed in here from Your
     * travelers, it waits with that traveler to land at the Waystation. */
    boardedAs: null,
    onStamp: function (stamp) {
      if (window.parent !== window) {
        window.parent.postMessage({ apb: "trip-over", stamp: stamp }, "*");
      }
      if (!stamp || !Module.boardedAs) return;
      var who = Module.boardedAs;
      who.stamp = stamp;
      Travelers.save(who).then(function () {
        statusLine.textContent = "The trip is over. Its Travel Stamp is waiting with " + who.name +
          " at the Waystation. Reload the page to travel again.";
      });
    },
    /* Start a trip: from the buttons, or from a test with a choices file. */
    start: function (departure, choices, pass) {
      var seed = Date.now() % 65536;
      var file = "";
      if (choices !== undefined) {
        FS.writeFile("/choices.txt", choices);
        seed = 0;
        file = "/choices.txt";
      }
      document.getElementById("pick").style.display = "none";
      canvas.style.display = "block";
      if (choices === undefined && !pass) drawTravelers();
      canvas.focus();
      /* A choices file that runs out ends the game with exit(): that's the end, too. */
      var ended = function (e) {
        if (!e || e.name !== "ExitStatus") throw e;
        Module.onTripOver();
      };
      try {
        Promise.resolve(Module.ccall("web_start", null, ["string", "number", "string", "string"],
                                     [departure, seed, file, pass || ""], { async: true })).catch(ended);
      } catch (e) {
        ended(e);
      }
    }
  };

  document.querySelectorAll("#pick button").forEach(function (b) {
    b.disabled = true;
    b.addEventListener("click", function () { Module.start(b.dataset.departure); });
  });

  window.addEventListener("keydown", function (e) {
    if (canvas.style.display !== "block" || e.ctrlKey || e.metaKey || e.altKey) return;
    if (Module.audio && Module.audio.state === "suspended") Module.audio.resume();
    if (e.key === "Enter") Module.keys.push(13);
    else if (e.key === "Backspace") Module.keys.push(8);
    else if (e.key === "Escape") Module.keys.push(27);
    else if (e.key === "ArrowUp") Module.keys.push(0x201);
    else if (e.key === "ArrowDown") Module.keys.push(0x202);
    else if (e.key === "ArrowLeft") Module.keys.push(0x203);
    else if (e.key === "ArrowRight") Module.keys.push(0x204);
    else if (e.key.length === 1 && e.key.charCodeAt(0) >= 32 && e.key.charCodeAt(0) < 127)
      Module.keys.push(e.key.charCodeAt(0));
    else return;
    e.preventDefault();
  });

  /* Pasting types the text: a Passport copied from the Waystation, line breaks and all. */
  window.addEventListener("paste", function (e) {
    var text = e.clipboardData ? e.clipboardData.getData("text") : "";
    if (canvas.style.display !== "block" || !text) return;
    for (var i = 0; i < text.length; i++) {
      var c = text.charCodeAt(i);
      if (c === 10) Module.keys.push(13);
      else if (c >= 32 && c < 127) Module.keys.push(c);
    }
    e.preventDefault();
  });

  /* Your travelers (travelers.js): choose one, and their Passport is typed in for them, a line
   * at a time and a blank line after, as the boarding desk asks. */
  var saved = [];
  function drawTravelers() {
    var box = document.getElementById("board-as");
    var who = document.getElementById("board-who");
    Travelers.list().then(function (list) {
      saved = list;
      who.innerHTML = "";
      list.forEach(function (t) {
        var o = document.createElement("option");
        o.value = t.id;
        o.textContent = t.name + (t.about ? " - " + t.about : "") + (t.note ? " (" + t.note + ")" : "");
        who.appendChild(o);
      });
      box.style.display = list.length ? "flex" : "none";
    });
  }
  Travelers.onChange(function () { if (canvas.style.display === "block") drawTravelers(); });
  document.getElementById("board-type").addEventListener("click", function () {
    var id = document.getElementById("board-who").value;
    var t = saved.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    Module.boardedAs = t;
    var text = (t.passport.match(/.{1,20}/g) || []).join("\n") + "\n\n";
    for (var i = 0; i < text.length; i++) {
      Module.keys.push(text.charCodeAt(i) === 10 ? 13 : text.charCodeAt(i));
    }
    canvas.focus();
  });

  canvas.addEventListener("click", function (e) {
    if (Module.audio && Module.audio.state === "suspended") Module.audio.resume();
    var r = canvas.getBoundingClientRect();
    Module.keys.push(0x100 | Math.floor((e.clientY - r.top) / r.height * 25));
  });
</script>
<script src="apb.js"></script>
</body>
</html>
