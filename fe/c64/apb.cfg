# The C64 memory map (docs/c64.md): cc65's c64-overlay.cfg, with three overlays.
# BASIC is banked out, so the program runs from $0801 to $CFFF: the main program, then
# its buffers, the stack, the VM's car and at the top the overlay area, which LOAD, PASS
# and BATTLE take turns to fill (files OVL1..OVL3 on the disk, built here as
# apb.1..apb.3). BATTLE, the biggest, spreads down over the car too, which the VM loads
# again after a fight (APB_FIGHT_BORROWS_CAR in vm/vm.c).
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:     type = import;
    __EXEHDR__:       type = import;
    __OVERLAYADDR__:  type = import;
    __STACKSIZE__:    type = weak,   value = $0180; # 384 bytes: the deepest route uses about 115
    __OVERLAYSIZE__:  type = weak,   value = $3C00; # 15k overlay
    __HIMEM__:        type = weak,   value = $D000;
    __OVERLAYSTART__: type = export, value = __HIMEM__ - __OVERLAYSIZE__;
    __CARSIZE__:      type = weak,   value = 6144 + 16;  # APB_VM_CAR_MAX, and its padding
    __CARSTART__:     type = export, value = __OVERLAYSTART__ - __CARSIZE__;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,                size = $001A;
    LOADADDR: file = %O,               start = %S - 2,               size = $0002;
    HEADER:   file = %O, define = yes, start = %S,                   size = $000D;
    # MAIN ends where the car begins, not at __HIMEM__: the startup code puts the C
    # stack at the end of MAIN, and it must not grow down into the car or an overlay.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__,      size = __CARSTART__ - __HEADER_LAST__;
    BSS:      file = "",               start = __ONCE_RUN__,         size = __CARSTART__ - __STACKSIZE__ - __ONCE_RUN__;
    CAR:      file = "",               start = __CARSTART__,         size = __CARSIZE__;
    OVL1ADDR: file = "%O.1",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL1:     file = "%O.1",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    OVL2ADDR: file = "%O.2",           start = __OVERLAYSTART__ - 2, size = $0002;
    OVL2:     file = "%O.2",           start = __OVERLAYSTART__,     size = __OVERLAYSIZE__;
    OVL3ADDR: file = "%O.3",           start = __CARSTART__ - 2,     size = $0002;
    OVL3:     file = "%O.3",           start = __CARSTART__,         size = __CARSIZE__ + __OVERLAYSIZE__;
    OVL4ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
    OVL5ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
    OVL6ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
    OVL7ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
    OVL8ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
    OVL9ADDR: file = "",             start = __OVERLAYSTART__ - 2, size = $0002;   # unused
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,                optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define = yes;
    BSS:      load = BSS,      type = bss, define = yes;
    CARBUF:   load = CAR,      type = bss, define = yes;
    OVL1ADDR: load = OVL1ADDR, type = ro;
    OVERLAY1: load = OVL1,     type = ro,  define = yes, optional = yes;
    OVL1DATA: load = OVL1,     type = ro,  optional = yes;   # its constants: never the same segment as code
    OVL2ADDR: load = OVL2ADDR, type = ro;
    OVERLAY2: load = OVL2,     type = ro,  define = yes, optional = yes;
    OVL2DATA: load = OVL2,     type = ro,  optional = yes;   # its constants: never the same segment as code
    # Its buffers (the desk's typed lines, the Passport's bits): used only while it's
    # loaded, so they take overlay space, not the main program's. Never zeroed, and gone
    # when another overlay loads: nothing may rely on them being 0, or lasting.
    OVL2BSS:  load = OVL2,     type = bss, optional = yes;
    OVL3ADDR: load = OVL3ADDR, type = ro;
    OVERLAY3: load = OVL3,     type = ro,  define = yes, optional = yes;
    OVL3DATA: load = OVL3,     type = ro,  optional = yes;   # its constants: never the same segment as code
    OVL3BSS:  load = OVL3,     type = bss, optional = yes;   # the fight's buffers, as OVL2BSS
    OVL4ADDR: load = OVL4ADDR, type = ro;
    OVL5ADDR: load = OVL5ADDR, type = ro;
    OVL6ADDR: load = OVL6ADDR, type = ro;
    OVL7ADDR: load = OVL7ADDR, type = ro;
    OVL8ADDR: load = OVL8ADDR, type = ro;
    OVL9ADDR: load = OVL9ADDR, type = ro;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
