# The disk (docs/cartridge.md): the program APB, loading at $0801 with the resident
# engine in it, which diskstart.s copies to $1000; and the assets, files ANN of 8 KB each
# (with their load address, $8000, the staging RAM).
MEMORY {
    ZP:     file = "",            start = $0010, size = $00F0;
    LOAD:   file = %O,            start = $07FF, size = $0002;
    PRG:    file = %O,            start = $0801, size = $77FF;
    RAM:    file = "",            start = $1000, size = $7000;
    A00:    file = "%O.a00",      start = $7FFE, size = $2002;
    A01:    file = "%O.a01",      start = $7FFE, size = $2002;
    A02:    file = "%O.a02",      start = $7FFE, size = $2002;
    A03:    file = "%O.a03",      start = $7FFE, size = $2002;
    EXPAND: file = "",            start = $0400, size = $0C00;
}
SEGMENTS {
    LOADADDR: load = LOAD, type = ro;
    EXEHDR:   load = PRG,  type = ro;
    STARTUP:  load = PRG,  type = ro;
    RESIDENT: load = PRG,  run = RAM, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    A00ADDR:  load = A00,  type = ro;
    ASSET00:  load = A00,  type = ro;
    A01ADDR:  load = A01,  type = ro;
    ENDING:   load = A01,  type = ro, define = yes;
    A02ADDR:  load = A02,  type = ro;
    BATTLE:   load = A02,  type = ro, define = yes;
    A03ADDR:  load = A03,  type = ro;
    FIGHT:    load = A03,  run = EXPAND, type = ro, define = yes;
}
