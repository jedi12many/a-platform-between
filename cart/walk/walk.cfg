# The walking engine (docs/walk.md): one program, loaded at $0801 (a BASIC line, SYS 2061,
# then the code), from a Kung Fu Flash 2 or an SD2IEC alike. What it generates and draws
# goes above it (cart/walk/walk.inc), from $2800.
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    MAIN:     file = %O, start = $0801, size = $73FF;   # (past $27FF only HIGH's, the
                                                        # squares' and SEEING's loads: they're
                                                        # copied out before gen.s or the
                                                        # colour map write there)
    HIGH:     file = "", start = $F200, size = $0D00;   # the interrupts' code, to $FEFF
    SEE:      file = "", start = $E000, size = $1200;   # seeing (seeing.s, watch.s), to $F1FF
    VARS:     file = "", start = $B200, size = $0C00;   # above the colour map and seeing's
                                                        # log; then the sprites' programs
                                                        # (walk.inc)
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN, type = ro;
    CODE:     load = MAIN, type = ro;
    DATA:     load = MAIN, type = ro, define = yes;
    HIGH:     load = MAIN, run = HIGH, type = ro, define = yes;
    SQUARES:  load = MAIN, type = ro, define = yes;
    SEEING:   load = MAIN, run = SEE, type = ro, define = yes;
    BSS:      load = VARS, type = bss, define = yes;
}
