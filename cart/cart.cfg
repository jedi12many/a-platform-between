# The cartridge (docs/cartridge.md): a 1 MB EasyFlash, linked a chip at a time. ld65
# writes bank 0 as a file of 16 KB (build/cart/apb.b00: ROML, then ROMH) and each asset as
# one of 8 KB; tools/crt.py makes the .crt of them. Bank 0: the start, then the resident
# engine as it's copied to RAM (ROML and on into ROMH: in 16K mode they're one), and the
# Ultimax boot at ROMH's end. Asset n is bank 1 + n/2, ROML for n even, ROMH for n odd,
# each linked at $8000, the staging RAM it's copied to (cart/assets.s).
MEMORY {
    ZP:     file = "",            start = $0010, size = $00F0;
    RAM:    file = "",            start = $1000, size = $7000;
    B00:    file = "%O.b00",      start = $8000, size = $3F00, fill = yes;
    B00V:   file = "%O.b00",      start = $FF00, size = $0100, fill = yes;
    A00:    file = "%O.a00",      start = $8000, size = $2000, fill = yes;
    A01:    file = "%O.a01",      start = $8000, size = $2000, fill = yes;
    A02:    file = "%O.a02",      start = $8000, size = $2000, fill = yes;
}
SEGMENTS {
    STARTUP:  load = B00,  type = ro;
    RESIDENT: load = B00,  run = RAM, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    BOOT:     load = B00V, type = ro;
    VECTORS:  load = B00V, type = ro, start = $FFFA;
    ASSET00:  load = A00,  type = ro;
    ENDING:   load = A01,  type = ro, define = yes;
    BATTLE:   load = A02,  type = ro, define = yes;
}
