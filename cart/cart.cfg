# The cartridge (docs/cartridge.md): a 1 MB EasyFlash, linked a chip at a time. ld65
# writes each chip as a file of its own (build/cart/apb.bNNl, .bNNh); tools/crt.py makes
# the .crt of them. Bank 0: the start (ROML), the resident engine as it's copied to RAM
# and the Ultimax boot (ROMH). Asset n is bank 1 + n/2, ROML for n even, ROMH for n odd,
# each linked at $8000, the staging RAM it's copied to (cart/assets.s).
MEMORY {
    ZP:     file = "",            start = $0010, size = $00F0;
    RAM:    file = "",            start = $1000, size = $7000;
    B00L:   file = "%O.b00l",     start = $8000, size = $2000, fill = yes;
    B00H:   file = "%O.b00h",     start = $A000, size = $1F00, fill = yes;
    B00V:   file = "%O.b00h",     start = $FF00, size = $0100, fill = yes;
    A00:    file = "%O.a00",      start = $8000, size = $2000, fill = yes;
    A01:    file = "%O.a01",      start = $8000, size = $2000, fill = yes;
}
SEGMENTS {
    STARTUP:  load = B00L, type = ro;
    RESIDENT: load = B00H, run = RAM, type = rw, define = yes;
    BSS:      load = RAM,  type = bss, define = yes;
    BOOT:     load = B00V, type = ro;
    VECTORS:  load = B00V, type = ro, start = $FFFA;
    ASSET00:  load = A00,  type = ro;
    ASSET01:  load = A01,  type = ro;
}
